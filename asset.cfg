[application]

title = "Sprite Pipeline"
description = "[Archived v1.1.0] AI-powered sprite generation directly in Godot Editor, with your own OpenAI key (gpt-image models) or through a sprite-pipeline-backend server (protocol 2.0.0). Batch-generates sprite sheets from a simple YAML queue file with a free-text global style prompt and cuts them into frames at the size you set. Local caching of Pool-mode results prevents duplicate generations. Published as an engineering reference; not actively maintained."
author = "fabs133"
version = "1.1.0"
license = "MIT"
repository = "https://github.com/fabs133/sprite-pipeline-plugin"
icon = "addons/sprite_pipeline/icon.png"

[categories]

category.main = "2D Tools"
category.sub = "2D"

[dependencies]

godot = "4.2"

[files]

include = [
	"addons/sprite_pipeline/**"
]
